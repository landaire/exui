[package]
name = "exui-runtime"
version.workspace = true
edition.workspace = true
description = "XUI scene runtime"

[lib]
path = "src/lib.rs"

[dependencies]
exui-core = { workspace = true }
exui-extension = { workspace = true }
libm = "0.2"
thiserror = { workspace = true }
winnow = { workspace = true, features = ["binary"] }
xbox360-draw = { git = "https://github.com/landaire/rust-xbox360", rev = "35336d10773559934957d317386705fc6d849840" }
xbox360-image = { git = "https://github.com/landaire/rust-xbox360", rev = "35336d10773559934957d317386705fc6d849840" }
zune-inflate = { version = "0.2", default-features = false, features = ["zlib"] }

[dev-dependencies]
insta = { workspace = true }
xbox360-raster = { git = "https://github.com/landaire/rust-xbox360", rev = "35336d10773559934957d317386705fc6d849840" }
