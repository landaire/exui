[workspace]
resolver = "3"
members = [".", "crates/exui-core", "crates/exui-extension", "crates/exui-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
exui-core = { path = "crates/exui-core" }
exui-extension = { path = "crates/exui-extension" }
insta = "1"
thiserror = { version = "2", default-features = false }
winnow = { version = "1", default-features = false }

[package]
name = "exui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "exui"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
exui-core = { workspace = true }
memmap2 = "0.9"
quick-xml = "0.37"
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = "1"
